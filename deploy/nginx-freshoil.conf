# FreshOil — конфиг nginx для статического лендинга.
# __DOMAIN__ и __WEBROOT__ подставляет deploy/setup.sh.
# HTTPS (блок listen 443 и редирект с http) допишет certbot автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __WEBROOT__;
    index index.html;
    charset utf-8;

    # Приём заявок (/api/order) — подключается скриптом deploy/setup-mail.sh
    include /etc/nginx/snippets/freshoil-*.conf;

    # Скрытые файлы (.git и т.п.) наружу не отдаём
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML всегда свежий — изменения видны сразу после деплоя
    location ~* \.html$ {
        expires -1;
    }

    # Статика кешируется в браузере на 30 дней
    location ~* \.(svg|png|jpe?g|webp|gif|ico|css|js|woff2?)$ {
        expires 30d;
        access_log off;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
